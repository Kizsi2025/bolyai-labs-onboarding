name: CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # állítsd a gépteremben használt verzióra
      # Szándékosan nem a tanuló requirements.txt-jéből telepítünk:
      # egy Windows-specifikus vagy rossz kódolású fájl így nem bukatja el a buildet,
      # a tartalmát a tesztek ellenőrzik.
      - run: python -m pip install numpy pandas pytest
      - run: python -m pytest -v
